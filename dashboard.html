<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1526; --paper: #152033; --ink: #e4ecf7; --muted: #93a4bd;
    --line: #2a3b56; --raw: #e0b0a4; --raw-bg: #3a2a32; --fail: #d9c4a4;
    --fail-bg: #332e28; --ok: #a8cfc0; --ok-bg: #1d3330; --env: #b7c4d4; --env-bg: #243244;
    --hover: #1c2b44; --accent: #9eb6e8; --field: #10192c; --rule: #7f93ad;
    --scroll-track: #0b1322; --scroll-thumb: #7ea4d4; --scroll-thumb-hover: #a9c4e8;
    --nav-width: 300px;
  }
  * { box-sizing: border-box; }
  @supports not selector(::-webkit-scrollbar) {
    * {
      scrollbar-width: auto;
      scrollbar-color: var(--scroll-thumb) var(--scroll-track);
    }
  }
  *::-webkit-scrollbar { width: 14px; height: 14px; }
  *::-webkit-scrollbar-track {
    background: var(--scroll-track);
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #a9c4e8, #6d94c6);
    border: 3px solid var(--scroll-track);
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  *::-webkit-scrollbar-corner { background: transparent; }
  ::selection { background: #2a4a78; color: var(--ink); }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; grid-template-columns: var(--nav-width) minmax(0, 1fr);
    background: var(--bg); color: var(--ink); font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  aside {
    grid-column: 1; grid-row: 1; min-width: 0;
    background: var(--paper); border-right: 1px solid var(--line);
    overflow: auto; padding: 16px 12px 28px;
  }
  #nav-split {
    position: fixed; z-index: 5; top: 0; bottom: 0;
    left: calc(var(--nav-width) - 3px); width: 12px;
    border: 0; padding: 0; background: transparent;
    cursor: col-resize; touch-action: none; user-select: none;
  }
  #nav-split::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px;
    background: transparent;
  }
  #nav-split::after {
    content: ""; position: absolute; top: 50%; left: 1px; width: 4px; height: 4px;
    margin-top: -2px; border-radius: 50%; background: var(--muted);
    box-shadow: 0 -7px 0 var(--muted), 0 7px 0 var(--muted);
    opacity: 0.45;
  }
  #nav-split:hover::before,
  #nav-split:focus-visible::before,
  body.nav-resizing #nav-split::before {
    background: var(--accent); width: 2px; left: 2px;
  }
  #nav-split:hover::after,
  #nav-split:focus-visible::after,
  body.nav-resizing #nav-split::after {
    opacity: 1; background: var(--accent);
    box-shadow: 0 -7px 0 var(--accent), 0 7px 0 var(--accent);
  }
  #nav-split:focus-visible { outline: none; }
  main { grid-column: 2; grid-row: 1; overflow: auto; padding: 24px 28px 64px; min-width: 0; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.03em; }
  h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  h3 { margin: 0; font-size: 18px; }
  .fight-head {
    margin: 0 8px 10px; font-size: 18px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.25;
  }
  button.fight-head {
    display: block; width: 100%; font: inherit; font-size: 18px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.25; text-align: left; color: inherit;
    background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    margin: 0 0 10px; padding: 4px 8px;
  }
  button.fight-head:hover, button.fight-head.on { background: var(--hover); }
  .meta { color: var(--muted); margin: 0; }
  a { color: var(--accent); }
  button.nav, button.link {
    font: inherit; color: inherit; cursor: pointer; text-align: left;
  }
  button.link { background: none; border: 0; padding: 0; color: var(--accent); }
  button.nav {
    width: 100%; display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
    border: 0; border-radius: 8px; background: transparent; padding: 7px 8px;
  }
  button.nav > span:first-child { min-width: 0; }
  button.nav:hover { background: var(--hover); }
  button.nav[hidden] { display: none; }
  button.nav.on { background: var(--raw-bg); }
  button.nav .countline { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  button.nav.on .countline { color: var(--raw); }
  .fold { margin: 10px 0 2px; }
  .fold summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
    padding: 7px 8px; border-radius: 8px; color: var(--muted);
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary::marker { content: ""; }
  .fold summary::before {
    content: ""; flex: 0 0 auto; width: 0; height: 0;
    border-style: solid; border-width: 4px 0 4px 5px;
    border-color: transparent transparent transparent currentColor;
  }
  .fold[open] > summary::before { transform: rotate(90deg); }
  .fold summary:hover { background: var(--hover); color: var(--ink); }
  .fold-title { flex: 1; min-width: 0; }
  .fold .countline { color: var(--muted); font-size: 12px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  details.session > summary {
    text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; color: var(--ink);
  }
  details.session > summary .countline { font-size: 13px; }
  details.session.on > summary { background: var(--raw-bg); color: var(--ink); }
  .session-body { padding: 2px 0 6px 12px; }
  .session-body > .fold { margin: 0; }
  .session-body > .fold > summary {
    text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; color: var(--ink);
  }
  input.filter {
    width: 100%; margin: 4px 0 8px; padding: 7px 8px; border-radius: 8px;
    border: 1px solid var(--line); font: inherit; color: var(--ink); background: var(--field);
  }
  input.filter::placeholder { color: var(--muted); }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 28px; letter-spacing: -0.03em; }
  .stat span { color: var(--muted); font-size: 13px; }
  section { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-right: 4px; }
  .tag.raw { background: var(--raw-bg); color: var(--raw); }
  .tag.fail { background: var(--fail-bg); color: var(--fail); }
  .tag.low, .tag.env, .tag.unknown { background: var(--env-bg); color: var(--env); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .mech, .pull-block { border-top: 1px solid var(--line); padding: 12px 0; }
  .mech:first-of-type, .pull-block:first-of-type { border-top: 0; padding-top: 0; }
  .mech-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .death { padding: 10px 0 4px; }
  .death-body { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
  .stills { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
  .still { margin: 8px 0 0; width: 300px; max-width: 100%; }
  .still-open {
    display: block; width: 100%; margin: 0; padding: 0;
    border: 0; background: transparent; color: inherit; font: inherit;
    cursor: zoom-in; border-radius: 12px;
  }
  .still-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .still-open:hover svg { border-color: var(--accent); }
  .still svg {
    width: 100%; height: auto; aspect-ratio: 1; display: block;
    background: #f7f4ee; border: 1px solid var(--line); border-radius: 12px;
  }
  .still figcaption { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .still-title { display: block; color: var(--ink); font-weight: 650; margin-bottom: 2px; }
  .still-pop {
    width: min(880px, calc(100vw - 24px), calc(100vh - 80px));
    max-height: calc(100vh - 24px);
    overflow: auto;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--paper); color: var(--ink);
    padding: 12px 12px 18px;
  }
  .still-pop::backdrop { background: rgba(6, 10, 18, 0.78); }
  .still-pop-bar {
    display: flex; justify-content: flex-end;
    position: sticky; top: 0; z-index: 1;
    background: var(--paper); padding-bottom: 8px;
  }
  .still-close {
    font: inherit; font-size: 14px; color: var(--ink);
    background: var(--hover); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 12px; cursor: pointer;
  }
  .still-close:hover { background: var(--field); }
  .still-pop .still { width: 100%; margin: 0; }
  .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .time, .job { color: var(--muted); }
  .job-icon { width: 20px; height: 20px; display: block; }
  .cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; margin-top: 6px; font-size: 14px; }
  .cols b { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .blames { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
  .blame {
    display: inline-flex; align-items: baseline; gap: 6px;
    background: var(--fail-bg); color: var(--ink);
    border-radius: 999px; padding: 1px 8px; font-size: 13px;
  }
  .blame b { display: inline; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--fail); font-variant-numeric: tabular-nums; }
  .blame.sure { background: var(--ok-bg); }
  .blame.sure b { color: var(--ok); }
  .quiet { color: var(--muted); }
  .clean { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .component { border-top: 1px solid var(--line); padding: 12px 0; }
  .component:first-of-type { border-top: 0; padding-top: 4px; }
  .component-name { font-weight: 650; margin: 0 0 8px; }
  .seats { display: flex; flex-wrap: wrap; gap: 6px; }
  .seat {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border-radius: 999px; padding: 3px 8px 3px 4px; border: 1px solid var(--line);
    background: var(--hover);
  }
  .seat.ok { background: var(--ok-bg); border-color: #3f6a5e; color: var(--ok); }
  .seat.fail { background: var(--fail-bg); border-color: #6d624c; color: var(--fail); }
  .seat .job-icon { width: 24px; height: 24px; }
  .seat-name { color: var(--ink); font-weight: 650; }
  .mark { width: 16px; height: 16px; display: block; flex: 0 0 auto; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
  }
  .session-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start;
    border-top: 1px solid var(--line);
  }
  details.session-preview > summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
    padding: 10px 4px; border-radius: 8px;
  }
  details.session-preview > summary::-webkit-details-marker { display: none; }
  details.session-preview > summary::marker { content: ""; }
  details.session-preview > summary::before {
    content: ""; flex: 0 0 auto; width: 0; height: 0;
    border-style: solid; border-width: 4px 0 4px 5px;
    border-color: transparent transparent transparent var(--muted);
  }
  details.session-preview[open] > summary::before { transform: rotate(90deg); }
  details.session-preview > summary:hover { background: var(--hover); }
  details.session-preview > summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .preview-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .preview-title { font-size: 16px; font-weight: 650; }
  .preview-body { padding: 2px 8px 12px 18px; }
  button.open-session {
    font: inherit; font-size: 13px; color: var(--accent); background: var(--field);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 10px; margin: 10px 4px 0 8px; cursor: pointer;
  }
  button.open-session:hover { background: var(--hover); }
  .reach {
    display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); height: 480px; margin-top: 4px;
  }
  .reach.mini { margin-top: 0; grid-template-columns: 11rem minmax(0, 1fr); }
  .reach-names { position: relative; }
  .reach-names span {
    position: absolute; right: 8px; transform: translateY(50%);
    font-size: 12px; line-height: 1.15; color: var(--muted); text-align: right; white-space: nowrap;
  }
  .chart, .mini-plot, .trend-plot { position: relative; }
  .chart { height: 100%; overflow-x: auto; }
  .plot, .mini-plot { display: flex; align-items: flex-end; gap: 2px; }
  .plot { position: relative; height: 100%; min-width: 100%; width: max-content; }
  .mini-plot { height: 100%; width: 100%; }
  .hline {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 2px dotted var(--rule);
    pointer-events: none; z-index: 2;
  }
  .mini-plot .hline, .trend-plot .hline { border-top-width: 1px; border-top-color: rgba(147, 164, 189, 0.55); }
  .hline.goal { border-top-style: dashed; border-top-color: rgba(147, 164, 189, 0.85); }
  .reach-names span.goal { color: var(--muted); }
  .chart .bar {
    position: relative; z-index: 1;
    width: 9px; flex: 0 0 9px; min-height: 4px; border: 0; padding: 0; cursor: pointer;
    border-radius: 2px 2px 0 0;
  }
  .chart .bar:hover, .chart .bar.on { outline: 2px solid var(--ink); outline-offset: 1px; }
  .chart .bar.best { box-shadow: inset 0 -3px 0 var(--ink); }
  .mini-plot i.tick { flex: 1 1 0; min-width: 1px; min-height: 2px; border-radius: 2px 2px 0 0; display: block; }
  .trend-reach {
    display: grid; grid-template-columns: 12.5rem minmax(0, 1fr);
  }
  .trend-reach .reach-names { align-self: start; }
  .trend-scroll { overflow-x: auto; min-width: 0; }
  .trend-plot { height: 100%; }
  .trend-cols { position: relative; z-index: 1; display: flex; height: 100%; }
  .trend-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
  .trend-dot {
    position: absolute; z-index: 4; width: 10px; height: 10px; border-radius: 50%;
    background: var(--paper); border: 2px solid var(--accent); transform: translate(-50%, 50%);
    pointer-events: none;
  }
  button.trend-col {
    font: inherit; color: inherit; background: transparent; border: 0; border-radius: 8px;
    cursor: pointer; padding: 0; height: 100%; flex: 0 0 auto;
    display: flex; align-items: flex-end;
  }
  button.trend-col:hover, button.trend-col:focus-visible { background: rgba(228, 236, 247, 0.06); }
  .trend-bars { display: flex; align-items: flex-end; width: 100%; height: 100%; gap: 2px; }
  .trend-bars i { flex: 0 0 9px; width: 9px; min-height: 2px; border-radius: 2px 2px 0 0; display: block; }
  .trend-axis { display: flex; margin-top: 6px; }
  .trend-axis > span {
    flex: 0 0 auto; text-align: center; font-size: 12px; line-height: 1.25; color: var(--muted); padding: 0 4px;
  }
  .trend-axis > span b { display: block; color: var(--ink); font-size: 13px; font-weight: 650; }
  .trend-axis > span span { display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .pip {
    width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(228, 236, 247, 0.22);
  }
  .pct {
    display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.45;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    border-radius: 999px; padding: 0 6px; border: 1px solid transparent;
  }
  button.nav.pull {
    box-shadow: inset 4px 0 0 var(--phase, transparent);
    scroll-margin-top: 120px;
  }
  .pull-name { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .pull-key {
    position: sticky; top: -16px; z-index: 3;
    display: grid; gap: 4px; padding: 16px 8px 8px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .key-phase { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  button.key-phase-name {
    display: inline-flex; align-items: center; gap: 5px;
    font: inherit; font-size: 12px; font-weight: 650; margin-right: 2px;
    color: inherit; cursor: pointer; border: 0; background: transparent;
    border-radius: 999px; padding: 1px 6px 1px 2px;
  }
  button.key-phase-name:hover, button.key-phase-name.in { background: var(--hover); }
  button.key-phase-name.on { background: var(--raw-bg); }
  button.key-mech {
    font: inherit; font-size: 12px; font-weight: 700; line-height: 1.45;
    white-space: nowrap; cursor: pointer;
    border-radius: 999px; padding: 0 6px; border: 1px solid transparent;
  }
  button.key-mech:hover, button.key-mech.on { outline: 2px solid var(--ink); outline-offset: 1px; }
  button.key-phase-name:focus-visible, button.key-mech:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }
  .pull-empty { margin: 6px 8px; font-size: 13px; }
  .route {
    --stop: #6a81a0;
    list-style: none; margin: 14px 0 2px; padding: 2px 0;
  }
  .route li {
    display: grid; grid-template-columns: 28px minmax(0, 1fr);
    align-items: stretch; min-height: 46px;
  }
  .route .rail {
    position: relative; display: flex; justify-content: center; align-items: center;
  }
  .route .rail::before {
    content: ""; position: absolute; left: 50%; width: 3px; margin-left: -1.5px;
    top: 0; bottom: 0; background: var(--stop); border-radius: 2px;
  }
  .route li:first-child .rail::before { top: 50%; }
  .route li:last-child .rail::before { bottom: 50%; }
  .route li:only-child .rail::before { content: none; }
  .route .dot {
    width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box;
    background: var(--paper); border: 3px solid var(--stop);
    box-shadow: 0 0 0 4px var(--paper);
    position: relative; z-index: 1;
  }
  .route button.station {
    font: inherit; font-size: 18px; font-weight: 600; line-height: 1.3;
    color: var(--accent); background: transparent; border: 0; border-radius: 8px;
    text-align: left; cursor: pointer; padding: 10px 10px 10px 4px; width: 100%;
  }
  .route li:hover button.station { background: var(--hover); }
  .route li:hover .dot { background: var(--stop); }
  .route button.station:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  body.nav-resizing { cursor: col-resize; user-select: none; }
  body.nav-resizing * { cursor: col-resize; }
  body.nav-resizing aside,
  body.nav-resizing main { pointer-events: none; }
  @media (max-width: 860px) {
    body { display: block; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 42vh; }
    #nav-split { display: none; }
    .stats, .cols, header, .mech-head, .death-body { display: block; }
    .reach { grid-template-columns: 9.5rem minmax(0, 1fr); height: 420px; }
    .reach.mini { grid-template-columns: 8.5rem minmax(0, 1fr); }
    .trend-reach { grid-template-columns: 8.5rem minmax(0, 1fr); }
    .reach-names span { font-size: 11px; }
  }
</style>
<script>
var NAV = { key: "nav-width", min: 200, gutter: 320, def: 300 };
try {
  var savedNav = Number(localStorage.getItem(NAV.key));
  if (savedNav >= NAV.min) {
    var navCap = Math.max(NAV.min, innerWidth - NAV.gutter);
    document.documentElement.style.setProperty("--nav-width", Math.round(Math.min(navCap, savedNav)) + "px");
  }
} catch (e) {}
</script>
</head>
<body>
<aside id="nav"></aside>
<div id="nav-split" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-description="Drag to resize the sidebar. Double-click to reset." aria-valuemin="200" aria-valuenow="300" tabindex="0"></div>
<main id="app"></main>
<dialog id="still-pop" class="still-pop" aria-label="Closer look">
  <form method="dialog" class="still-pop-bar">
    <button type="submit" class="still-close">Close</button>
  </form>
  <div id="still-pop-body"></div>

const byCode = Object.fromEntries(DATA.sessions.map(item => [item.code, item]));
const detailLoads = {};
const MINI_H = 148;
const TREND_H = 300;

let stillFrames = [];

function registerDetail(code, detail) {
  const session = byCode[code];
  if (!session) return;
  session.pulls = detail.pulls || [];
  session.mechanics = detail.mechanics || [];
  session.unknown = detail.unknown || {};
  session.totals = detail.totals || {};
  if (detail.raw != null) session.raw = detail.raw;
  if (detail.fail != null) session.fail = detail.fail;
  if (detail.low != null) session.low = detail.low;
  session._loaded = true;
}
function embeddedDetail() {
  const node = document.getElementById("session-detail");
  if (!node || !node.textContent.trim()) return null;
  return JSON.parse(node.textContent);
}
function detailFromPage(text) {
  const marker = 'id="session-detail">';
  const start = text.indexOf(marker);
  if (start < 0) throw new Error("empty detail");
  const from = start + marker.length;
  const end = text.indexOf("<" + "/script>", from);
  if (end < 0) throw new Error("empty detail");
  return JSON.parse(text.slice(from, end));
}
function loadDetail(code) {
  const session = byCode[code];
  if (!session) return Promise.reject(new Error("missing session"));
  if (session._loaded) return Promise.resolve(session);
  const only = DATA.sessions.length === 1 ? DATA.sessions[0].code : "";
  if (only === code) {
    const embedded = embeddedDetail();
    if (embedded) {
      registerDetail(code, embedded);
      if (session._loaded) return Promise.resolve(session);
    }
  }
  if (!session.detail) return Promise.reject(new Error("no detail"));
  if (detailLoads[code]) return detailLoads[code];
  detailLoads[code] = fetch(session.detail).then(response => {
    if (!response.ok) throw new Error("detail failed");
    return response.text();
  }).then(text => {
    registerDetail(code, detailFromPage(text));
    if (!session._loaded) throw new Error("empty detail");
    return session;
  }).catch(error => {
    delete detailLoads[code];
    throw error;
  });
  return detailLoads[code];
}

function counts(deaths) {
  const c = { raw: 0, fail: 0, low: 0, environment: 0, unknown: 0 };
  for (const row of deaths) c[row.outcome] = (c[row.outcome] || 0) + 1;
  return c;
}
function judged(deaths) {
  return deaths.filter(row => row.outcome !== "environment");
}
function jobMark(job) {
  const src = JOB_ICONS[job];
  if (!src) return `<span class="job">${job}</span>`;
  return `<img class="job-icon" alt="${job}" title="${job}" src="${src}">`;
}
function blameChips(row) {
  const blames = row.blames || [];
  if (!blames.length) return "";
  return `<div class="blames">${blames.map(blame => {
    const sure = blame.confidence >= 100 ? " sure" : "";
    return `<span class="blame${sure}" title="How sure this blame is">${esc(blame.who)} <b>${blame.confidence}%</b></span>`;
  }).join("")}</div>`;
}
function deathCard(row, opts) {
  const cast = row.cast ? `<span class="time">${row.cast}</span>` : "";
  const body = `<div class="cols">
      <div><b>What happened</b>${row.happened}</div>
      <div><b>What went wrong</b>${esc(row.wrong)}${blameChips(row)}</div>
    </div>`;
  const showFrame = row.frame && !(opts && opts.skipFrame);
  const framed = showFrame
    ? `<div class="death-body">${stillFrame(row.frame)}${body}</div>`
    : body;
  return `<div class="death">
    <div class="who"><span class="time">${row.time}</span>${cast}<strong>${row.name}</strong>${jobMark(row.job)}</div>

  </div>`;

function stillCaption(frame) {
  if (!frame.title) return esc(frame.caption);
  return `<span class="still-title">${esc(frame.title)}</span>${esc(frame.caption)}`;
}
function stillFrame(frame) {
  const id = stillFrames.length;

      if (token !== renderToken) return;
    } else {
      pending.catch(() => {});
    }
  }
  closeStill();
  stillFrames = [];
  if (!SESSION) app.innerHTML = renderHome();
  else if (where.view === "pull") app.innerHTML = renderPull(where.id);
  else if (where.view === "fight") app.innerHTML = renderFight(where.id);
  else if (where.view === "mechanic") app.innerHTML = renderMechanic(where.id);
  else app.innerHTML = renderAll();
  placeTrendScroll();
  paintActive();
  const stamp = SESSION ? [SESSION.dayLabel, SESSION.timeLabel].filter(Boolean).join(" ") : "Sessions";
  document.title = !SESSION
    ? "Sessions"
    : where.view === "pull" || where.view === "fight"
      ? `Pull ${where.id} · ${stamp}`
      : where.view === "mechanic"
        ? `${(findMech(where.id) || {}).name || where.id} · ${stamp}`
        : stamp;
}
const pullFilters = {};
function pullFilterOf(code) {
  return pullFilters[code] || { phase: "", mechanic: "" };
}
function scopeHides(button) {
  if (!button.classList.contains("pull")) return false;
  const fold = button.closest('details[data-fold^="pulls-"]');
  if (!fold) return false;
  const filter = pullFilterOf(fold.dataset.fold.slice("pulls-".length));
  if (filter.phase && button.dataset.phase !== filter.phase) return true;
  if (filter.mechanic && (button.dataset.mechanic || "") !== filter.mechanic) return true;
  return false;
}
function syncPullKey(key) {
  const filter = pullFilterOf(key.dataset.session);
  const active = Boolean(filter.phase || filter.mechanic);
  for (const chip of key.querySelectorAll("button[data-pull-phase]")) {
    const phase = chip.dataset.pullPhase;
    const mechanic = chip.dataset.pullMechanic || "";
    const phaseOn = !mechanic && filter.phase === phase && !filter.mechanic;
    const mechOn = Boolean(mechanic) && filter.phase === phase && filter.mechanic === mechanic;
    const narrowed = !mechanic && filter.phase === phase && Boolean(filter.mechanic);
    chip.classList.toggle("on", mechanic ? mechOn : phaseOn);
    chip.classList.toggle("in", narrowed);
    chip.setAttribute("aria-pressed", mechanic ? String(mechOn) : String(phaseOn));
    if (mechanic) {
      chip.title = mechOn ? "Show every pull" : `Show pulls that ended at ${mechanic}`;
    } else {
      const name = chip.dataset.pullName || "";
      if (phaseOn) chip.title = "Show every pull";
      else if (narrowed) chip.title = `Show every pull that ended in ${name}`;
      else chip.title = `Show pulls that ended in ${name}`;
    }
  }
  const fold = key.closest("details.fold");
  if (!fold) return;
  const buttons = [...fold.querySelectorAll("button.nav.pull")];
  const matched = buttons.filter(button => !scopeHides(button)).length;
  const line = fold.querySelector("summary .countline");
  if (line) line.textContent = active ? `${matched}/${buttons.length}` : String(buttons.length);
  const note = fold.querySelector(".pull-empty");
  if (note) note.hidden = !(active && matched === 0);
}
function applyNavFilters() {
  const query = (document.getElementById("filter")?.value || "").trim().toLowerCase();
  for (const session of document.querySelectorAll("#nav details.session")) {
    const label = (session.dataset.label || "").toLowerCase();
    session.dataset.hit = query && label.includes(query) ? "1" : "";
  }
  for (const button of document.querySelectorAll("#nav button.nav")) {
    if (button.dataset.keep) {
      button.hidden = false;
      continue;
    }
    const session = button.closest("details.session");
    const sessionHit = session && session.dataset.hit === "1";
    const label = button.dataset.label || "";
    const textHidden = query !== "" && !sessionHit && !label.includes(query);
    button.hidden = textHidden || scopeHides(button);
  }
  for (const key of document.querySelectorAll("#nav .pull-key")) syncPullKey(key);
  const active = document.querySelector("#nav button.nav.on");
  for (const session of document.querySelectorAll("#nav details.session")) {
    const buttons = [...session.querySelectorAll("button.nav")].filter(button => !button.dataset.keep);
    const textMatch = buttons.some(button => (button.dataset.label || "").includes(query));
    const matched = !query || session.dataset.hit === "1" || textMatch;
    session.hidden = Boolean(query) && !matched;
    session.open = query ? matched : savedOpen(session, active);
  }
  for (const fold of document.querySelectorAll("#nav details.fold:not(.session)")) {
    const buttons = [...fold.querySelectorAll("button.nav")].filter(button => !button.dataset.keep);
    const foldId = fold.dataset.fold || "";
    const filtering = foldId.startsWith("pulls-") && Boolean(pullFilterOf(foldId.slice("pulls-".length)).phase);
    if (query) {
      fold.open = filtering || buttons.some(button => (button.dataset.label || "").includes(query));
      continue;
    }
    fold.open = filtering || savedOpen(fold, active);
  }
}
document.body.addEventListener("click", event => {
  const opener = event.target.closest("[data-still]");
  if (opener) {
    openStill(opener.dataset.still);
    return;
  }
  const chip = event.target.closest("#nav button[data-pull-phase]");
  if (chip) {
    const key = chip.closest(".pull-key");
    const phase = chip.dataset.pullPhase;
    const mechanic = chip.dataset.pullMechanic || "";
    const code = key.dataset.session;
    const current = pullFilterOf(code);
    if (mechanic) {
      if (current.phase === phase && current.mechanic === mechanic) delete pullFilters[code];
      else pullFilters[code] = { phase, mechanic };
    } else if (current.phase === phase && !current.mechanic) {
      delete pullFilters[code];
    } else {
      pullFilters[code] = { phase, mechanic: "" };
    }
    applyNavFilters();
    return;
  }
  const summary = event.target.closest("#nav summary");
  if (summary) {
    const fold = summary.parentElement;
    foldState[fold.dataset.fold] = !fold.open;
  }
  const row = event.target.closest("[data-go]");
  if (!row) return;
  const next = row.dataset.go;
  if ((location.hash.replace(/^#/, "") || "") === next) render();
  location.hash = next;
});
function savedOpen(fold, active) {
  const saved = fold.dataset.fold in foldState ? foldState[fold.dataset.fold] : fold.dataset.default === "1";
  return saved || Boolean(active && fold.contains(active));
}
document.body.addEventListener("input", event => {
  if (event.target.id !== "filter") return;
  applyNavFilters();
});
const trendScrollLeft = {};
function placeTrendScroll() {
  for (const node of document.querySelectorAll(".trend-scroll")) {
    const key = node.dataset.trend || "";
    const saved = trendScrollLeft[key];
    node.scrollLeft = saved == null ? node.scrollWidth : saved;
  }
}
document.body.addEventListener("scroll", event => {
  const node = event.target;
  if (!node.classList || !node.classList.contains("trend-scroll")) return;
  trendScrollLeft[node.dataset.trend || ""] = node.scrollLeft;
}, true);
document.body.addEventListener("toggle", event => {
  const node = event.target;
  if (!node.classList || !node.classList.contains("session-preview")) return;
  previewOpen[node.dataset.code] = node.open;
}, true);
window.addEventListener("hashchange", render);
document.getElementById("still-pop").addEventListener("click", event => {
  if (event.target.id === "still-pop") event.target.close();
});
render();

function navMax() {
  return Math.max(NAV.min, window.innerWidth - NAV.gutter);
}
function clampNav(px) {
  return Math.round(Math.min(navMax(), Math.max(NAV.min, px)));
}
function shownNav() {
  const n = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--nav-width"));
  return Number.isFinite(n) ? n : NAV.def;
}
let navPreferred = NAV.def;
try {
  const saved = Number(localStorage.getItem(NAV.key));
  if (saved >= NAV.min) navPreferred = saved;
} catch (e) {}
function applyNavWidth(persist) {
  const shown = clampNav(navPreferred);
  document.documentElement.style.setProperty("--nav-width", shown + "px");
  const handle = document.getElementById("nav-split");
  if (handle) {
    handle.setAttribute("aria-valuenow", String(shown));
    handle.setAttribute("aria-valuemin", String(NAV.min));
    handle.setAttribute("aria-valuemax", String(navMax()));
  }
  if (!persist) return;
  try { localStorage.setItem(NAV.key, String(Math.round(navPreferred))); } catch (e) {}
}
applyNavWidth(false);
const navSplit = document.getElementById("nav-split");
if (navSplit) {
  let drag = null;
  navSplit.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    event.preventDefault();
    navSplit.setPointerCapture(event.pointerId);
    drag = { id: event.pointerId, offset: shownNav() - event.clientX, moved: false };
    document.body.classList.add("nav-resizing");
  });
  navSplit.addEventListener("pointermove", event => {
    if (!drag || event.pointerId !== drag.id) return;
    const next = clampNav(event.clientX + drag.offset);
    if (next === clampNav(navPreferred)) return;
    drag.moved = true;
    navPreferred = next;
    applyNavWidth(false);
  });
  function endNavDrag(event) {
    if (!drag || event.pointerId !== drag.id) return;
    const moved = drag.moved;
    drag = null;
    document.body.classList.remove("nav-resizing");
    if (moved) applyNavWidth(true);
  }
  navSplit.addEventListener("pointerup", endNavDrag);
  navSplit.addEventListener("pointercancel", endNavDrag);
  navSplit.addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
  });
  navSplit.addEventListener("dblclick", event => {
    event.preventDefault();
    navPreferred = NAV.def;
    applyNavWidth(true);
  });
  navSplit.addEventListener("keydown", event => {
    const step = event.shiftKey ? 48 : 16;
    const shown = shownNav();
    let next = null;
    if (event.key === "ArrowLeft") next = shown - step;
    else if (event.key === "ArrowRight") next = shown + step;
    else if (event.key === "Home") next = NAV.min;
    else if (event.key === "End") next = navMax();
    else return;
    event.preventDefault();
    navPreferred = clampNav(next);
    applyNavWidth(true);
  });
}
window.addEventListener("resize", () => applyNavWidth(false));
</script>
