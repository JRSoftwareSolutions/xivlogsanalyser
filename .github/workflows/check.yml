name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Every saved log was judged with the current rules
        run: python -m xivloganalyzer status
      - name: Every call the user checked still holds
        run: python -m xivloganalyzer verify
      - name: Calls this change moves
        if: github.event_name == 'pull_request'
        run: |
          {
            echo '```'
            python -m xivloganalyzer changes --since "origin/${{ github.base_ref }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Generated pages match the code and mechanics
        run: |
          python -m xivloganalyzer reanalyze --all
          if ! git diff --quiet; then
            git diff --stat
            echo "::error::Run python -m xivloganalyzer reanalyze and commit the pages it rewrites."
            exit 1
          fi
