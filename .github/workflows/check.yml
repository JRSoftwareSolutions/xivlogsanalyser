name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Generated pages match the code and mechanics
        run: |
          python -m xivloganalyzer reanalyze
          if ! git diff --quiet; then
            git diff --stat
            echo "::error::Run python -m xivloganalyzer reanalyze and commit the pages it rewrites."
            exit 1
          fi
