<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f4f1ea; --paper: #fffcf7; --ink: #1c1915; --muted: #5e584f;
    --line: #e2dbd0; --raw: #9a3412; --raw-bg: #fff1e8; --fail: #7c4a12;
    --fail-bg: #fbf3e4; --ok: #1f5c45; --ok-bg: #e7f4ee; --env: #3f4a57; --env-bg: #eef2f5;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; grid-template-columns: 300px 1fr;
    background: var(--bg); color: var(--ink); font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  aside {
    background: var(--paper); border-right: 1px solid var(--line);
    overflow: auto; padding: 16px 12px 28px;
  }
  main { overflow: auto; padding: 24px 28px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.03em; }
  h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  h3 { margin: 0; font-size: 18px; }
  .fight-head {
    margin: 0 8px 10px; font-size: 18px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.25;
  }
  button.fight-head {
    display: block; width: 100%; font: inherit; font-size: 18px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.25; text-align: left; color: inherit;
    background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    margin: 0 0 10px; padding: 4px 8px;
  }
  button.fight-head:hover, button.fight-head.on { background: #f7f4ee; }
  .meta { color: var(--muted); margin: 0; }
  a { color: #243056; }
  button.nav, button.link {
    font: inherit; color: inherit; cursor: pointer; text-align: left;
  }
  button.link { background: none; border: 0; padding: 0; color: #243056; }
  button.nav {
    width: 100%; display: flex; justify-content: space-between; gap: 8px; align-items: baseline;
    border: 0; border-radius: 8px; background: transparent; padding: 7px 8px;
  }
  button.nav:hover { background: #f7f4ee; }
  button.nav[hidden] { display: none; }
  button.nav.on { background: var(--raw-bg); }
  button.nav .countline { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  button.nav.on .countline { color: var(--raw); }
  .fold { margin: 10px 0 2px; }
  .fold summary {
    display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
    padding: 7px 8px; border-radius: 8px; color: var(--muted);
    font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .fold summary::-webkit-details-marker { display: none; }
  .fold summary::marker { content: ""; }
  .fold summary::before {
    content: ""; flex: 0 0 auto; width: 0; height: 0;
    border-style: solid; border-width: 4px 0 4px 5px;
    border-color: transparent transparent transparent currentColor;
  }
  .fold[open] > summary::before { transform: rotate(90deg); }
  .fold summary:hover { background: #f7f4ee; color: var(--ink); }
  .fold-title { flex: 1; }
  .fold .countline { color: var(--muted); font-size: 12px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  details.session > summary {
    text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; color: var(--ink);
  }
  details.session > summary .countline { font-size: 13px; }
  details.session.on > summary { background: var(--raw-bg); color: var(--ink); }
  .session-body { padding: 2px 0 6px 12px; }
  .session-body > .fold { margin: 0; }
  .session-body > .fold > summary {
    text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 600; color: var(--ink);
  }
  input.filter {
    width: 100%; margin: 4px 0 8px; padding: 7px 8px; border-radius: 8px;
    border: 1px solid var(--line); font: inherit; background: #fff;
  }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 28px; letter-spacing: -0.03em; }
  .stat span { color: var(--muted); font-size: 13px; }
  section { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; margin-right: 4px; }
  .tag.raw { background: var(--raw-bg); color: var(--raw); }
  .tag.fail { background: var(--fail-bg); color: var(--fail); }
  .tag.low, .tag.env, .tag.unknown { background: var(--env-bg); color: var(--env); }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .mech, .pull-block { border-top: 1px solid var(--line); padding: 12px 0; }
  .mech:first-of-type, .pull-block:first-of-type { border-top: 0; padding-top: 0; }
  .mech-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .death { padding: 10px 0 4px; }
  .who { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .time, .job { color: var(--muted); }
  .job-icon { width: 20px; height: 20px; display: block; }
  .cols { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 12px; margin-top: 6px; font-size: 14px; }
  .cols b { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .blames { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; }
  .blame {
    display: inline-flex; align-items: baseline; gap: 6px;
    background: var(--fail-bg); color: var(--ink);
    border-radius: 999px; padding: 1px 8px; font-size: 13px;
  }
  .blame b { display: inline; font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--fail); font-variant-numeric: tabular-nums; }
  .blame.sure { background: var(--ok-bg); }
  .blame.sure b { color: var(--ok); }
  .quiet { color: var(--muted); }
  .clean { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .component { border-top: 1px solid var(--line); padding: 12px 0; }
  .component:first-of-type { border-top: 0; padding-top: 4px; }
  .component-name { font-weight: 650; margin: 0 0 8px; }
  .seats { display: flex; flex-wrap: wrap; gap: 6px; }
  .seat {
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    border-radius: 999px; padding: 3px 8px 3px 4px; border: 1px solid var(--line);
    background: #f7f4ee;
  }
  .seat.ok { background: var(--ok-bg); border-color: #cfe3d8; color: var(--ok); }
  .seat.fail { background: var(--fail-bg); border-color: #e6d3b0; color: var(--fail); }
  .seat .job-icon { width: 24px; height: 24px; }
  .seat-name { color: var(--ink); font-weight: 650; }
  .mark { width: 16px; height: 16px; display: block; flex: 0 0 auto; }
  .sr {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;
  }
  button.session-card {
    width: 100%; display: block; text-align: left; font: inherit; color: inherit;
    background: transparent; border: 0; border-top: 1px solid var(--line);
    padding: 12px 0 4px; cursor: pointer;
  }
  button.session-card:hover { background: #f7f4ee; }
  .reach {
    display: grid; grid-template-columns: 12.5rem minmax(0, 1fr); height: 480px; margin-top: 4px;
  }
  .reach-names { position: relative; }
  .reach-names span {
    position: absolute; right: 8px; transform: translateY(50%);
    font-size: 12px; line-height: 1.15; color: var(--muted); text-align: right; white-space: nowrap;
  }
  .chart, .strip { position: relative; }
  .chart { height: 100%; overflow-x: auto; }
  .plot, .strip { display: flex; align-items: flex-end; gap: 2px; }
  .plot { position: relative; height: 100%; min-width: 100%; width: max-content; }
  .strip { height: 52px; width: 100%; margin: 8px 0 4px; }
  .hline {
    position: absolute; left: 0; right: 0; height: 0;
    border-top: 2px dotted #5c554c;
    pointer-events: none; z-index: 2;
  }
  .strip .hline { border-top-width: 1px; border-top-color: rgba(94, 88, 79, 0.7); }
  .chart .bar {
    position: relative; z-index: 1;
    width: 9px; flex: 0 0 9px; min-height: 4px; border: 0; padding: 0; cursor: pointer;
    border-radius: 2px 2px 0 0;
  }
  .chart .bar:hover, .chart .bar.on { outline: 2px solid var(--ink); outline-offset: 1px; }
  .chart .bar.best { box-shadow: inset 0 -3px 0 var(--ink); }
  .strip i.tick { flex: 1 1 2px; min-width: 2px; min-height: 3px; border-radius: 2px 2px 0 0; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .pip {
    width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto;
    box-shadow: inset 0 0 0 1px rgba(28, 25, 21, 0.18);
  }
  .pct {
    display: inline-block; font-size: 12px; font-weight: 700; line-height: 1.45;
    font-variant-numeric: tabular-nums; white-space: nowrap;
    border-radius: 999px; padding: 0 6px; border: 1px solid transparent;
  }
  button.nav.pull {
    box-shadow: inset 4px 0 0 var(--phase, transparent);
    scroll-margin-top: 120px;
  }
  .pull-name { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .pull-key {
    position: sticky; top: -16px; z-index: 3;
    display: grid; gap: 4px; padding: 16px 8px 8px;
    background: var(--paper); border-bottom: 1px solid var(--line);
  }
  .key-phase { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .key-phase-name {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 650; margin-right: 2px;
  }
  .route {
    --stop: #8a5a2b;
    list-style: none; margin: 14px 0 2px; padding: 2px 0;
  }
  .route li {
    display: grid; grid-template-columns: 28px minmax(0, 1fr);
    align-items: stretch; min-height: 46px;
  }
  .route .rail {
    position: relative; display: flex; justify-content: center; align-items: center;
  }
  .route .rail::before {
    content: ""; position: absolute; left: 50%; width: 3px; margin-left: -1.5px;
    top: 0; bottom: 0; background: var(--stop); border-radius: 2px;
  }
  .route li:first-child .rail::before { top: 50%; }
  .route li:last-child .rail::before { bottom: 50%; }
  .route li:only-child .rail::before { content: none; }
  .route .dot {
    width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box;
    background: var(--paper); border: 3px solid var(--stop);
    box-shadow: 0 0 0 4px var(--paper);
    position: relative; z-index: 1;
  }
  .route button.station {
    font: inherit; font-size: 18px; font-weight: 600; line-height: 1.3;
    color: #243056; background: transparent; border: 0; border-radius: 8px;
    text-align: left; cursor: pointer; padding: 10px 10px 10px 4px; width: 100%;
  }
  .route li:hover button.station { background: #f7f4ee; }
  .route li:hover .dot { background: var(--stop); }
  .route button.station:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (max-width: 860px) {
    body { display: block; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 42vh; }
    .stats, .cols, header, .mech-head { display: block; }
    .reach { grid-template-columns: 9.5rem minmax(0, 1fr); height: 420px; }
    .reach-names span { font-size: 11px; }
  }
</style>
</head>
<body>
<aside id="nav"></aside>
<main id="app"></main>
<script>
const DATA = __DATA__;
const JOB_ICONS = __JOB_ICONS__;
const byCode = Object.fromEntries(DATA.sessions.map(item => [item.code, item]));
let SESSION = null;

function counts(deaths) {
  const c = { raw: 0, fail: 0, low: 0, environment: 0, unknown: 0 };
  for (const row of deaths) c[row.outcome] = (c[row.outcome] || 0) + 1;
  return c;
}
function judged(deaths) {
  return deaths.filter(row => row.outcome !== "environment");
}
function jobMark(job) {
  const src = JOB_ICONS[job];
  if (!src) return `<span class="job">${job}</span>`;
  return `<img class="job-icon" alt="${job}" title="${job}" src="${src}">`;
}
function blameChips(row) {
  const blames = row.blames || [];
  if (!blames.length) return "";
  return `<div class="blames">${blames.map(blame => {
    const sure = blame.confidence >= 100 ? " sure" : "";
    return `<span class="blame${sure}" title="How sure this blame is">${esc(blame.who)} <b>${blame.confidence}%</b></span>`;
  }).join("")}</div>`;
}
function deathCard(row) {
  const cast = row.cast ? `<span class="time">${row.cast}</span>` : "";
  return `<div class="death">
    <div class="who"><span class="time">${row.time}</span>${cast}<strong>${row.name}</strong>${jobMark(row.job)}</div>
    <div class="cols">
      <div><b>What happened</b>${row.happened}</div>
      <div><b>What it should have been</b>${row.should}</div>
      <div><b>Whose fault</b>${blameChips(row)}${row.wrong}</div>
    </div>
  </div>`;
}
function route() {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  const parts = hash.split("/").filter(Boolean);
  if (parts[0] === "s" && byCode[parts[1]]) {
    if (parts[2] === "pull") return { view: "pull", code: parts[1], id: parts[3] };
    if (parts[2] === "fight") return { view: "fight", code: parts[1], id: parts[3] };
    if (parts[2] === "mechanic") return { view: "mechanic", code: parts[1], id: parts.slice(3).join("/") };
    return { view: "all", code: parts[1] };
  }
  const only = DATA.sessions.length === 1 ? DATA.sessions[0].code : "";
  if (parts[0] === "pull" && only) return { view: "pull", code: only, id: parts[1] };
  if (parts[0] === "mechanic" && only) return { view: "mechanic", code: only, id: parts.slice(1).join("/") };
  if (!hash && only) return { view: "all", code: only };
  return { view: "home", code: "" };
}
function currentGo() {
  const where = route();
  if (!where.code) return "home";
  if (where.view === "pull") return `s/${where.code}/pull/${where.id}`;
  if (where.view === "fight") return `s/${where.code}/fight/${where.id}`;
  if (where.view === "mechanic") return `s/${where.code}/mechanic/${where.id}`;
  return `s/${where.code}`;
}
function logHref(pullId) {
  const base = `https://www.fflogs.com/reports/${SESSION.code}`;
  return pullId ? `${base}?fight=${pullId}&type=deaths` : `${base}?type=deaths`;
}
function findPull(id) {
  return SESSION.pulls.find(pull => String(pull.id) === String(id));
}
function findMech(id) {
  return SESSION.mechanics.find(mech => mech.id === id);
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}
const foldState = {};
function fold(id, title, count, body, open, opts) {
  const shown = id in foldState ? foldState[id] : open;
  const extra = opts && opts.className ? ` ${opts.className}` : "";
  const label = opts && opts.label ? ` data-label="${esc(opts.label)}"` : "";
  const countHtml = count === "" || count == null ? "" : `<span class="countline">${count}</span>`;
  return `<details class="fold${extra}" data-fold="${esc(id)}"${label} data-default="${open ? "1" : "0"}"${shown ? " open" : ""}>
    <summary><span class="fold-title">${esc(title)}</span>${countHtml}</summary>
    ${body}
  </details>`;
}
function sessionStamp(item) {
  const session = byCode[item.code] || item;
  const day = session.dayLabel && session.dayLabel !== "No date" ? session.dayLabel : "";
  const time = session.timeLabel || item.timeLabel || "";
  return {
    title: day || time || item.code,
    time: day ? time : "",
    label: [day, time, item.fight, item.title, item.owner, item.code, "overview pulls mechanics"].filter(Boolean).join(" ").toLowerCase(),
  };
}
function byStartedDesc(a, b) {
  const as = (byCode[a.code] || {}).started || "";
  const bs = (byCode[b.code] || {}).started || "";
  if (as !== bs) return as < bs ? 1 : -1;
  return a.code.localeCompare(b.code);
}
function sessionGroups() {
  const items = [];
  for (const day of DATA.days) {
    for (const item of day.sessions) items.push(item);
  }
  items.sort(byStartedDesc);
  const groups = [];
  const index = new Map();
  for (const item of items) {
    const name = item.fight || "Sessions";
    let group = index.get(name);
    if (!group) {
      group = { name, sessions: [] };
      index.set(name, group);
      groups.push(group);
    }
    group.sessions.push(item);
  }
  return groups;
}
function overviewMap(session) {
  return new Map(((session.overview && session.overview.pulls) || []).map(pull => [pull.id, pull]));
}
function phaseMarks(session, phaseId) {
  return ((session.overview && session.overview.markers) || [])
    .filter(mark => mark.phase === phaseId)
    .slice()
    .sort((a, b) => a.at - b.at || a.name.localeCompare(b.name));
}
function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const l = (max + min) / 2;
  if (max === min) return [0, 0, l * 100];
  const d = max - min;
  const s = d / (1 - Math.abs(2 * l - 1));
  let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h *= 60;
  if (h < 0) h += 360;
  return [h, s * 100, l * 100];
}
function hslToRgb(h, s, l) {
  s /= 100;
  l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const hp = ((h % 360) + 360) % 360 / 60;
  const x = c * (1 - Math.abs(hp % 2 - 1));
  let r = 0;
  let g = 0;
  let b = 0;
  if (hp < 1) [r, g, b] = [c, x, 0];
  else if (hp < 2) [r, g, b] = [x, c, 0];
  else if (hp < 3) [r, g, b] = [0, c, x];
  else if (hp < 4) [r, g, b] = [0, x, c];
  else if (hp < 5) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  const m = l - c / 2;
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
function channel(v) {
  const n = v / 255;
  return n <= 0.03928 ? n / 12.92 : ((n + 0.055) / 1.055) ** 2.4;
}
function relLum(r, g, b) {
  return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b);
}
function contrast(a, b) {
  const hi = Math.max(a, b);
  const lo = Math.min(a, b);
  return (hi + 0.05) / (lo + 0.05);
}
function inkFor(h, s, l) {
  const [r, g, b] = hslToRgb(h, s, l);
  const lum = relLum(r, g, b);
  const dark = relLum(28, 25, 21);
  const light = relLum(255, 252, 247);
  return contrast(lum, dark) >= contrast(lum, light) ? "#1c1915" : "#fffcf7";
}
function progressTint(phaseId, t) {
  const id = Number(phaseId);
  if (!id) return { bg: "#eef2f5", fg: "#3f4a57", border: "#c5ced6" };
  const [h, s] = hexToHsl(phaseColor(id));
  const clamped = Math.min(1, Math.max(0, t));
  const L = 86 + (24 - 86) * clamped;
  const sat = Math.min(94, 46 + clamped * Math.max(28, s - 8));
  return {
    bg: `hsl(${Math.round(h)} ${Math.round(sat)}% ${Math.round(L)}%)`,
    fg: inkFor(h, sat, L),
    border: `hsl(${Math.round(h)} ${Math.round(Math.min(94, sat + 6))}% ${Math.round(Math.max(24, L - 16))}%)`,
  };
}
function mechanicTint(phaseId, index, count) {
  const t = count <= 1 ? 0.72 : index / (count - 1);
  return progressTint(phaseId, t);
}
function depthTint(phaseId, bossPct) {
  const pct = Number(bossPct);
  if (!Number.isFinite(pct)) return progressTint(0, 0);
  return progressTint(phaseId, 1 - Math.min(100, Math.max(0, pct)) / 100);
}
function shortMech(name) {
  return String(name).replace(/^Ascalon's /, "").replace(/ of the Ward$/, "").replace(/^Hyperdimensional /, "");
}
function pullReach(session, pull, far) {
  const phaseId = far ? far.phase : pull.phaseId;
  const phaseName = far ? far.phaseName : (pull.phase || "");
  const bossPct = far ? far.bossPct : pull.bossPct;
  const mechanic = far && far.mechanic ? far.mechanic : "";
  const marks = phaseMarks(session, phaseId);
  const index = mechanic ? marks.findIndex(mark => mark.name === mechanic) : -1;
  const tint = index >= 0 ? mechanicTint(phaseId, index, marks.length) : depthTint(phaseId, bossPct);
  return { phaseId, phaseName, bossPct, mechanic, tint, phase: phaseColor(phaseId) };
}
function tintStyle(tint) {
  return `background:${tint.bg};color:${tint.fg};border-color:${tint.border}`;
}
function pullKey(session) {
  const overview = overviewMap(session);
  const phases = new Map();
  for (const pull of session.pulls) {
    const far = overview.get(pull.id);
    if (!far) continue;
    let bucket = phases.get(far.phase);
    if (!bucket) {
      bucket = { id: far.phase, name: far.phaseName, mechs: new Set() };
      phases.set(far.phase, bucket);
    }
    if (far.mechanic) bucket.mechs.add(far.mechanic);
  }
  const rows = [...phases.values()].sort((a, b) => a.id - b.id);
  if (!rows.length) return "";
  const body = rows.map(row => {
    const marks = phaseMarks(session, row.id);
    const chips = marks.filter(mark => row.mechs.has(mark.name)).map(mark => {
      const tint = mechanicTint(row.id, marks.indexOf(mark), marks.length);
      return `<span class="pct" style="${tintStyle(tint)}" title="${esc(mark.name)}">${esc(shortMech(mark.name))}</span>`;
    }).join("");
    const hint = chips ? "" : ` title="The percent shade follows how much HP is left in ${esc(row.name)}"`;
    return `<div class="key-phase"${hint}><span class="key-phase-name"><i class="pip" style="background:${phaseColor(row.id)}" aria-hidden="true"></i>${esc(row.name)}</span>${chips}</div>`;
  }).join("");
  return `<div class="pull-key">${body}</div>`;
}
function pullNav(session) {
  const overview = overviewMap(session);
  return session.pulls.map(pull => {
    const reach = pullReach(session, pull, overview.get(pull.id));
    const when = pull.when ? `${pull.when} · ` : "";
    const where = reach.mechanic ? `${reach.mechanic} · ` : "";
    const label = `pull ${pull.id} ${pull.when || ""} ${reach.phaseName} ${reach.mechanic} ${reach.bossPct}`.toLowerCase();
    const title = `Pull ${pull.id} · ${reach.phaseName}${reach.mechanic ? " · " + reach.mechanic : ""} · ${reach.bossPct}%`;
    return `<button class="nav pull" data-go="s/${session.code}/pull/${pull.id}" data-label="${esc(label)}" title="${esc(title)}" style="--phase:${reach.phase}">
      <span class="pull-name"><i class="pip" style="background:${reach.phase}" title="${esc(reach.phaseName)}" aria-hidden="true"></i>Pull ${pull.id} <span class="quiet">${when}</span><span class="sr">${esc(reach.phaseName)}${reach.mechanic ? ", " + esc(reach.mechanic) : ""}</span></span>
      <span class="pct" style="${tintStyle(reach.tint)}" title="${esc(where)}${reach.bossPct}%">${reach.bossPct}%</span>
    </button>`;
  }).join("");
}
function mechNav(session) {
  return session.mechanics.slice().sort(byTimeline).map(mech => {
    const label = mech.name.toLowerCase();
    return `<button class="nav" data-go="s/${session.code}/mechanic/${mech.id}" data-label="${esc(label)}">
      <span>${mech.name}</span>
    </button>`;
  }).join("");
}
function sessionEntry(item, where) {
  const session = byCode[item.code];
  if (!session) return "";
  const open = where.code === item.code;
  const pullCount = (session.overview && session.overview.pulls.length) || session.pulls.length;
  const stamp = sessionStamp(item);
  const overview = `<button class="nav" data-go="s/${item.code}" data-keep="1" data-label="overview">
      <span>Overview</span><span class="countline">${pullCount}</span>
    </button>`;
  const pulls = fold(
    `pulls-${item.code}`,
    "Pulls",
    session.pulls.length,
    pullKey(session) + pullNav(session),
    open && (where.view === "pull" || where.view === "fight"),
  );
  const mechs = fold(
    `mechanics-${item.code}`,
    "Mechanics",
    session.mechanics.length,
    mechNav(session),
    open && where.view === "mechanic",
  );
  return fold(
    `session-${item.code}`,
    stamp.title,
    stamp.time,
    `<div class="session-body">${overview}${pulls}${mechs}</div>`,
    open,
    { className: "session", label: stamp.label },
  );
}
function fightHeader(name) {
  if (DATA.sessions.length > 1) {
    return `<button class="fight-head" data-go="home" data-keep="1">${esc(name)}</button>`;
  }
  return `<p class="fight-head">${esc(name)}</p>`;
}
function renderNav() {
  const where = route();
  const groups = sessionGroups();
  let html = "";
  groups.forEach((group, index) => {
    html += fightHeader(group.name);
    if (index === 0) {
      html += `<input class="filter" id="filter" placeholder="Find a session, pull, or mechanic" aria-label="Find a session, pull, or mechanic">`;
    }
    html += group.sessions.map(item => sessionEntry(item, where)).join("");
  });
  if (!groups.length) {
    html = `<p class="fight-head">Sessions</p>`;
  }
  document.getElementById("nav").innerHTML = html;
}
function byTimeline(a, b) {
  return a.phase - b.phase || a.starts - b.starts || a.name.localeCompare(b.name);
}
function phaseRoute(mechs, color) {
  if (!mechs.length) return `<p class="quiet">No mechanic review for this phase.</p>`;
  const stops = mechs.map(mech => `<li>
      <span class="rail" aria-hidden="true"><span class="dot"></span></span>
      <button class="station" data-go="s/${SESSION.code}/mechanic/${mech.id}">${mech.name}</button>
    </li>`).join("");
  return `<ol class="route" style="--stop:${color}">${stops}</ol>`;
}
function phaseColor(id) {
  const colors = ["#3d6b8a", "#b45309", "#9f1239", "#6d28d9", "#0f766e", "#a16207", "#1d4ed8", "#854d0e"];
  return colors[(Number(id) - 1) % colors.length] || "#5e584f";
}
function overviewOf(session) {
  return (session && session.overview) || { pulls: [], phases: [], best: null };
}
function reachScale(pulls) {
  return Math.max(1, ...pulls.map(pull => pull.reached || 0));
}
function visibleMarks(markers, scale) {
  return (markers || []).filter(mark => mark.at > 0 && mark.at < scale);
}
function strip(pulls, markers) {
  const scale = reachScale(pulls);
  const lines = visibleMarks(markers, scale).map(mark => {
    return `<i class="hline" style="bottom:${(mark.at / scale) * 100}%"></i>`;
  }).join("");
  const bars = pulls.map(pull => {
    const height = Math.max(8, ((pull.reached || 0) / scale) * 100);
    return `<i class="tick" style="height:${height}%;background:${phaseColor(pull.phase)}"></i>`;
  }).join("");
  return `<span class="strip">${lines}${bars}</span>`;
}
function chart(pulls, markers) {
  const scale = reachScale(pulls);
  const marks = visibleMarks(markers, scale);
  const bestId = (overviewOf(SESSION).best || {}).id;
  const names = marks.map(mark => {
    return `<span style="bottom:${(mark.at / scale) * 100}%">${mark.name}</span>`;
  }).join("");
  const lines = marks.map(mark => {
    return `<i class="hline" title="${mark.name}" style="bottom:${(mark.at / scale) * 100}%"></i>`;
  }).join("");
  const bars = pulls.map(pull => {
    const height = Math.max(6, ((pull.reached || 0) / scale) * 100);
    const go = pull.judged
      ? `s/${SESSION.code}/pull/${pull.id}`
      : `s/${SESSION.code}/fight/${pull.id}`;
    const mark = pull.id === bestId ? " best" : "";
    const where = pull.mechanic ? `${pull.mechanic} · ` : "";
    return `<button class="bar${mark}" data-go="${go}" title="Pull ${pull.id} · ${where}${pull.phaseName} ${pull.bossPct}% · ${pull.clock}" style="height:${height}%;background:${phaseColor(pull.phase)}"></button>`;
  }).join("");
  return `<div class="reach"><div class="reach-names">${names}</div><div class="chart"><div class="plot">${lines}${bars}</div></div></div>`;
}
function legend(pulls) {
  const seen = [];
  for (const pull of pulls) {
    if (!seen.some(row => row.phase === pull.phase)) seen.push(pull);
  }
  return `<p class="legend">${seen.map(pull => `<span><i class="swatch" style="background:${phaseColor(pull.phase)}"></i>${pull.phaseName}</span>`).join("")}</p>`;
}
function renderHome() {
  const blocks = DATA.days.map(day => `<section>
      <h2>${day.label}</h2>
      ${day.sessions.map(item => {
        const session = byCode[item.code];
        const overview = overviewOf(session);
        const best = overview.best;
        const detail = [
          item.title,
          item.owner,
          overview.pulls.length ? `${overview.pulls.length} pulls` : "",
          best ? `best ${best.phaseName} ${best.bossPct}%` : "",
        ].filter(Boolean).join(" · ");
        return `<button class="session-card" data-go="s/${item.code}">
          <div class="mech-head">
            <div>
              <h3>${item.timeLabel || item.code} <span class="meta">${item.fight}</span></h3>
              <p class="meta">${detail}</p>
            </div>
          </div>
          ${strip(overview.pulls, overview.markers)}
        </button>`;
      }).join("")}
    </section>`).join("");
  return `
    <header>
      <div>
        <h1>Sessions</h1>
        <p class="meta">${DATA.sessions.length === 1 ? "1 log" : DATA.sessions.length + " logs"}. Each bar is a pull. Taller means further into the fight.</p>
      </div>
    </header>
    ${blocks || `<p class="quiet">No sessions yet. Drop a log and analyze it.</p>`}`;
}
function renderAll() {
  const overview = overviewOf(SESSION);
  const best = overview.best;
  const stamp = [SESSION.dayLabel, SESSION.timeLabel, SESSION.owner].filter(part => part && part !== "No date").join(" · ");
  const byPhase = new Map();
  for (const pull of overview.pulls) {
    if (!byPhase.has(pull.phase)) byPhase.set(pull.phase, []);
    byPhase.get(pull.phase).push(pull);
  }
  const phases = [...byPhase.entries()].map(([id, pulls]) => {
    const sample = pulls[0];
    const mechs = SESSION.mechanics.filter(mech => mech.phase === id).sort(byTimeline);
    const reviewed = pulls.filter(pull => pull.judged).length;
    const rows = phaseRoute(mechs, phaseColor(id));
    const note = mechs.length && reviewed !== pulls.length
      ? `<p class="meta">${reviewed} pulls have a death review.</p>`
      : "";
    return `<section>
      <div class="mech-head">
        <h3>${sample.phaseName}</h3>
        <span class="meta">${pulls.length} pull${pulls.length === 1 ? "" : "s"} ended here</span>
      </div>
      <p class="meta">${sample.phaseFull}</p>
      ${note}
      ${rows}
    </section>`;
  }).join("");
  const bestLine = best
    ? `Best pull ${best.id}, ${best.phaseName} ${best.bossPct}%.`
    : "";
  return `
    <header>
      <div>
        <h1>${SESSION.fight}</h1>
        <p class="meta">${stamp}. ${overview.pulls.length} pulls. ${bestLine}</p>
      </div>
      <p class="meta"><a href="${logHref()}">Open the log</a></p>
    </header>
    <section>
      <h2>How far each pull got</h2>
      ${chart(overview.pulls, overview.markers)}
      ${legend(overview.pulls)}
      <p class="meta">Taller is further through the fight. A bar that crosses a line reached that mechanic.</p>
    </section>
    <div class="stats">
      <div class="stat"><b>${overview.pulls.length}</b><span>pulls</span></div>
      <div class="stat"><b>${best ? best.bossPct + "%" : "–"}</b><span>${best ? "best · " + best.phaseName : "best"}</span></div>
    </div>
    ${phases}`;
}
function renderFight(id) {
  const pull = overviewOf(SESSION).pulls.find(row => String(row.id) === String(id));
  if (!pull) return `<p>Pull ${id} is not in this session.</p>`;
  return `
    <header>
      <div>
        <h1>Pull ${pull.id}</h1>
        <p class="meta">${pull.when ? pull.when + " · " : ""}${pull.phaseFull} · ${pull.bossPct}% · ${pull.clock}</p>
      </div>
    </header>
    <section>
      <p>This pull ended in ${pull.phaseName} at ${pull.bossPct}%.</p>
      <p class="quiet">There is no death review for this pull.</p>
    </section>`;
}
function markIcon(passed) {
  if (passed) {
    return `<svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M4.2 8.2 6.7 10.6 11.8 5.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  return `<svg class="mark" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M5 5l6 6M11 5 5 11" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>`;
}
function seatMark(seat, partName) {
  const passed = Boolean(seat.passed);
  const word = passed ? "passed" : "failed";
  const name = passed ? "" : `<span class="seat-name">${seat.name}</span>`;
  return `<span class="seat ${passed ? "ok" : "fail"}" title="${seat.name} ${word} ${partName}">
    ${jobMark(seat.job)}
    ${markIcon(passed)}
    ${name}
    <span class="sr">${seat.name} ${word} ${partName}</span>
  </span>`;
}
function componentDeaths(pull, card, part) {
  return judged(pull.deaths).filter(row => row.mechanicId === card.id && row.componentId === part.id);
}
function renderPull(id) {
  const pull = findPull(id);
  if (!pull) return `<p>Pull ${id} is not in this session.</p>`;
  const reach = pullReach(SESSION, pull, overviewMap(SESSION).get(pull.id));
  const c = counts(pull.deaths);
  const cards = pull.cards || [];
  const blocks = cards.map(card => {
    const failed = new Set();
    for (const part of card.parts) {
      for (const seat of part.seats) if (!seat.passed) failed.add(seat.name);
    }
    const stamp = failed.size
      ? `<span class="tag fail">${failed.size === 1 ? "1 player failed" : failed.size + " players failed"}</span>`
      : `<span class="tag ok">Clear</span>`;
    const parts = card.parts.map(part => {
      const rows = componentDeaths(pull, card, part);
      const solo = card.parts.length === 1 && part.name === card.name;
      return `<div class="component">
        ${solo ? "" : `<div class="component-name">${part.name}</div>`}
        <div>
          <div class="seats">${part.seats.map(seat => seatMark(seat, part.name)).join("")}</div>
          ${rows.map(deathCard).join("")}
        </div>
      </div>`;
    }).join("");
    return `<section>
      <div class="mech-head">
        <h3><button class="link" data-go="s/${SESSION.code}/mechanic/${card.id}">${card.name}</button></h3>
        ${stamp}
      </div>
      ${parts}
    </section>`;
  }).join("");
  const covered = (row) => cards.some(card =>
    card.parts.some(part => row.mechanicId === card.id && row.componentId === part.id)
  );
  const loose = judged(pull.deaths).filter(row => !covered(row));
  const rest = loose.length
    ? `<section><h2>Other deaths</h2>${loose.map(deathCard).join("")}</section>`
    : "";
  const packets = c.environment
    ? `<p class="meta">${c.environment} deaths had no damage packet.</p>`
    : "";
  return `
    <header>
      <div>
        <h1>Pull ${pull.id}</h1>
        <p class="meta">${pull.when ? pull.when + " · " : ""}${esc(reach.phaseName)} · ${reach.bossPct}% wipe · ${pull.clock}</p>
      </div>
      <p class="meta"><a href="${logHref(pull.id)}">Open this pull</a></p>
    </header>
    ${blocks || `<section><p class="quiet">No mechanic review for this pull.</p></section>`}
    ${rest}
    ${packets}`;
}
function renderMechanic(id) {
  const mech = findMech(id);
  if (!mech) return `<p>That mechanic is not defined.</p>`;
  const blocks = [];
  let clean = 0;
  for (const pull of SESSION.pulls) {
    const rows = judged(pull.deaths).filter(row => row.mechanicId === mech.id);
    if (!rows.length) { clean += 1; continue; }
    blocks.push(`<div class="pull-block">
      <div class="mech-head">
        <h3><button class="link" data-go="s/${SESSION.code}/pull/${pull.id}">Pull ${pull.id}</button> <span class="meta">${pull.when ? pull.when + " · " : ""}${pull.bossPct}%</span></h3>
      </div>
      ${rows.map(deathCard).join("")}
    </div>`);
  }
  return `
    <header>
      <div>
        <h1>${mech.name}</h1>
        <p class="meta">${clean} pulls had no deaths to this.</p>
      </div>
    </header>
    <section>
      <p>${mech.should}</p>
      ${(mech.parts || []).length ? `<p class="meta">${mech.parts.map(part => part.name).join(" · ")}</p>` : ""}
    </section>
    <section>
      <h2>Pulls where someone died</h2>
      ${blocks.join("") || `<p class="quiet">Nobody died to this.</p>`}
    </section>`;
}
function paintActive() {
  const where = route();
  const go = currentGo();
  for (const button of document.querySelectorAll("#nav button.nav")) {
    button.classList.toggle("on", button.dataset.go === go);
  }
  for (const head of document.querySelectorAll("#nav button.fight-head")) {
    head.classList.toggle("on", !where.code);
  }
  for (const session of document.querySelectorAll("#nav details.session")) {
    session.classList.toggle("on", session.dataset.fold === `session-${where.code}`);
  }
  const active = document.querySelector(`#nav button.nav[data-go="${CSS.escape(go)}"]`);
  if (!active) return;
  let fold = active.closest("details.fold");
  while (fold) {
    if (!fold.open) {
      fold.open = true;
      foldState[fold.dataset.fold] = true;
    }
    fold = fold.parentElement ? fold.parentElement.closest("details.fold") : null;
  }
  active.scrollIntoView({ block: "nearest" });
}
function render() {
  const where = route();
  SESSION = where.code ? byCode[where.code] : null;
  if (render.navCode !== (where.code || "")) {
    const query = document.getElementById("filter")?.value || "";
    renderNav();
    render.navCode = where.code || "";
    const input = document.getElementById("filter");
    if (input && query) {
      input.value = query;
      input.dispatchEvent(new Event("input", { bubbles: true }));
    }
  }
  const app = document.getElementById("app");
  if (!SESSION) app.innerHTML = renderHome();
  else if (where.view === "pull") app.innerHTML = renderPull(where.id);
  else if (where.view === "fight") app.innerHTML = renderFight(where.id);
  else if (where.view === "mechanic") app.innerHTML = renderMechanic(where.id);
  else app.innerHTML = renderAll();
  paintActive();
  const stamp = SESSION ? [SESSION.dayLabel, SESSION.timeLabel].filter(Boolean).join(" ") : "Sessions";
  document.title = !SESSION
    ? "Sessions"
    : where.view === "pull" || where.view === "fight"
      ? `Pull ${where.id} · ${stamp}`
      : where.view === "mechanic"
        ? `${(findMech(where.id) || {}).name || where.id} · ${stamp}`
        : stamp;
}
document.body.addEventListener("click", event => {
  const summary = event.target.closest("#nav summary");
  if (summary) {
    const fold = summary.parentElement;
    foldState[fold.dataset.fold] = !fold.open;
  }
  const row = event.target.closest("[data-go]");
  if (!row) return;
  const next = row.dataset.go;
  if ((location.hash.replace(/^#/, "") || "") === next) render();
  location.hash = next;
});
function savedOpen(fold, active) {
  const saved = fold.dataset.fold in foldState ? foldState[fold.dataset.fold] : fold.dataset.default === "1";
  return saved || Boolean(active && fold.contains(active));
}
document.body.addEventListener("input", event => {
  if (event.target.id !== "filter") return;
  const query = event.target.value.trim().toLowerCase();
  for (const session of document.querySelectorAll("#nav details.session")) {
    const label = (session.dataset.label || "").toLowerCase();
    session.dataset.hit = query && label.includes(query) ? "1" : "";
  }
  for (const button of document.querySelectorAll("#nav button.nav")) {
    if (button.dataset.keep) {
      button.hidden = false;
      continue;
    }
    const session = button.closest("details.session");
    const sessionHit = session && session.dataset.hit === "1";
    const label = button.dataset.label || "";
    button.hidden = query !== "" && !sessionHit && !label.includes(query);
  }
  const active = document.querySelector("#nav button.nav.on");
  for (const session of document.querySelectorAll("#nav details.session")) {
    const buttons = [...session.querySelectorAll("button.nav")].filter(button => !button.dataset.keep);
    const matched = !query || session.dataset.hit === "1" || buttons.some(button => !button.hidden);
    session.hidden = Boolean(query) && !matched;
    session.open = query ? matched : savedOpen(session, active);
  }
  for (const fold of document.querySelectorAll("#nav details.fold:not(.session)")) {
    const buttons = [...fold.querySelectorAll("button.nav")].filter(button => !button.dataset.keep);
    if (query) {
      fold.open = buttons.some(button => (button.dataset.label || "").includes(query));
      continue;
    }
    fold.open = savedOpen(fold, active);
  }
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
