<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1526; --paper: #152033; --ink: #e4ecf7; --muted: #93a4bd;
    --line: #2a3b56; --raw: #e0b0a4; --raw-bg: #3a2a32; --fail: #d9c4a4;
    --fail-bg: #332e28; --ok: #a8cfc0; --ok-bg: #1d3330; --env: #b7c4d4; --env-bg: #243244;
    --hover: #1c2b44; --accent: #9eb6e8; --field: #10192c; --rule: #7f93ad;
    --scroll-track: #0b1322; --scroll-thumb: #7ea4d4; --scroll-thumb-hover: #a9c4e8;
    --nav-width: 300px;
  }
  * { box-sizing: border-box; }
  @supports not selector(::-webkit-scrollbar) {
    * {
      scrollbar-width: auto;
      scrollbar-color: var(--scroll-thumb) var(--scroll-track);
    }
  }
  *::-webkit-scrollbar { width: 14px; height: 14px; }
  *::-webkit-scrollbar-track {
    background: var(--scroll-track);
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #a9c4e8, #6d94c6);
    border: 3px solid var(--scroll-track);
    border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
  *::-webkit-scrollbar-corner { background: transparent; }
  ::selection { background: #2a4a78; color: var(--ink); }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; grid-template-columns: var(--nav-width) minmax(0, 1fr);
    background: var(--bg); color: var(--ink); font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  aside {
    grid-column: 1; grid-row: 1; min-width: 0;
    background: var(--paper); border-right: 1px solid var(--line);
    overflow: auto; padding: 16px 12px 28px;
  }
  #nav-split {
    position: fixed; z-index: 5; top: 0; bottom: 0;
    left: calc(var(--nav-width) - 3px); width: 12px;
    border: 0; padding: 0; background: transparent;
    cursor: col-resize; touch-action: none; user-select: none;
  }
  #nav-split::before {
    content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px;
    background: transparent;
  }
  #nav-split::after {
    content: ""; position: absolute; top: 50%; left: 1px; width: 4px; height: 4px;
    margin-top: -2px; border-radius: 50%; background: var(--muted);
    box-shadow: 0 -7px 0 var(--muted), 0 7px 0 var(--muted);
    opacity: 0.45;
  }
  #nav-split:hover::before,
  #nav-split:focus-visible::before,
  body.nav-resizing #nav-split::before {
    background: var(--accent); width: 2px; left: 2px;
  }
  #nav-split:hover::after,
  #nav-split:focus-visible::after,
  body.nav-resizing #nav-split::after {
    opacity: 1; background: var(--accent);
    box-shadow: 0 -7px 0 var(--accent), 0 7px 0 var(--accent);
  }
  #nav-split:focus-visible { outline: none; }
  main { grid-column: 2; grid-row: 1; overflow: auto; padding: 24px 28px 64px; min-width: 0; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.03em; }
  h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  h3 { margin: 0; font-size: 18px; }

    margin: 0 8px 10px; font-size: 18px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.25;
  }
  button.fight-head {
    display: block; width: 100%; font: inherit; font-size: 18px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.25; text-align: left; color: inherit;
    background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    margin: 0 0 10px; padding: 4px 8px;
  }
  button.fight-head:hover, button.fight-head.on { background: var(--hover); }
  .meta { color: var(--muted); margin: 0; }

  button.nav {

  .fold { margin: 10px 0 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 0 0; }

  button.nav.pull {

</style>
<script>
var NAV = { key: "nav-width", min: 200, gutter: 320, def: 300 };
try {
  var savedNav = Number(localStorage.getItem(NAV.key));
  if (savedNav >= NAV.min) {
    var navCap = Math.max(NAV.min, innerWidth - NAV.gutter);
    document.documentElement.style.setProperty("--nav-width", Math.round(Math.min(navCap, savedNav)) + "px");
  }
} catch (e) {}
</script>
</head>
<body>
<aside id="nav"></aside>
<div id="nav-split" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-description="Drag to resize the sidebar. Double-click to reset." aria-valuemin="200" aria-valuenow="300" tabindex="0"></div>
<main id="app"></main>
<script>
const DATA = __DATA__;
const JOB_ICONS = __JOB_ICONS__;
const byCode = Object.fromEntries(DATA.sessions.map(item => [item.code, item]));
const detailLoads = {};
const MINI_H = 148;
const TREND_H = 300;
let SESSION = null;

function registerDetail(code, detail) {
  const session = byCode[code];
  if (!session) return;
  session.pulls = detail.pulls || [];
  session.mechanics = detail.mechanics || [];
  session.unknown = detail.unknown || {};
  session.totals = detail.totals || {};
  if (detail.raw != null) session.raw = detail.raw;
  if (detail.fail != null) session.fail = detail.fail;
  if (detail.low != null) session.low = detail.low;
  session._loaded = true;
}
function loadDetail(code) {
  const session = byCode[code];
  if (!session) return Promise.reject(new Error("missing session"));
  if (session._loaded) return Promise.resolve(session);
  if (!session.detail) return Promise.reject(new Error("no detail"));
  if (detailLoads[code]) return detailLoads[code];
  // Fetched as text. A script tag is refused when this file is served as plain text.
  detailLoads[code] = fetch(session.detail).then(response => {
    if (!response.ok) throw new Error("detail failed");
    return response.text();
  }).then(text => {
    const open = text.indexOf("(");
    const close = text.lastIndexOf(")");
    if (open < 0 || close <= open) throw new Error("empty detail");
    const parsed = JSON.parse("[" + text.slice(open + 1, close) + "]");
    registerDetail(parsed[0], parsed[1]);
    if (!session._loaded) throw new Error("empty detail");
    return session;
  }).catch(error => {
    delete detailLoads[code];
    throw error;
  });
  return detailLoads[code];
}

function counts(deaths) {
  const c = { raw: 0, fail: 0, low: 0, environment: 0, unknown: 0 };
  for (const row of deaths) c[row.outcome] = (c[row.outcome] || 0) + 1;
  return c;
}
function judged(deaths) {
  return deaths.filter(row => row.outcome !== "environment");
}
function jobMark(job) {
  const src = JOB_ICONS[job];
  if (!src) return `<span class="job">${job}</span>`;
  return `<img class="job-icon" alt="${job}" title="${job}" src="${src}">`;
}
function blameChips(row) {
  const blames = row.blames || [];
  if (!blames.length) return "";
  return `<div class="blames">${blames.map(blame => {

      app.innerHTML = `<section><p class="quiet">Loading this review…</p></section>`;
      paintActive();
      try {
        await pending;
      } catch (error) {
        if (token !== renderToken) return;
        app.innerHTML = `<section><p>The review for this session did not load.</p></section>`;
        return;
      }
      if (token !== renderToken) return;
    } else {
      pending.catch(() => {});
    }
  }
  if (!SESSION) app.innerHTML = renderHome();
  else if (where.view === "pull") app.innerHTML = renderPull(where.id);
  else if (where.view === "fight") app.innerHTML = renderFight(where.id);
  else if (where.view === "mechanic") app.innerHTML = renderMechanic(where.id);
  else app.innerHTML = renderAll();
  placeTrendScroll();
  paintActive();
  const stamp = SESSION ? [SESSION.dayLabel, SESSION.timeLabel].filter(Boolean).join(" ") : "Sessions";
  document.title = !SESSION
    ? "Sessions"
    : where.view === "pull" || where.view === "fight"
      ? `Pull ${where.id} · ${stamp}`
      : where.view === "mechanic"
        ? `${(findMech(where.id) || {}).name || where.id} · ${stamp}`
        : stamp;
}
const pullFilters = {};
function pullFilterOf(code) {
  return pullFilters[code] || { phase: "", mechanic: "" };
}
function scopeHides(button) {
  if (!button.classList.contains("pull")) return false;
  const fold = button.closest('details[data-fold^="pulls-"]');
  if (!fold) return false;
  const filter = pullFilterOf(fold.dataset.fold.slice("pulls-".length));
  if (filter.phase && button.dataset.phase !== filter.phase) return true;
  if (filter.mechanic && (button.dataset.mechanic || "") !== filter.mechanic) return true;
  return false;
}
function syncPullKey(key) {
  const filter = pullFilterOf(key.dataset.session);
  const active = Boolean(filter.phase || filter.mechanic);
  for (const chip of key.querySelectorAll("button[data-pull-phase]")) {
    const phase = chip.dataset.pullPhase;
    const mechanic = chip.dataset.pullMechanic || "";
    const phaseOn = !mechanic && filter.phase === phase && !filter.mechanic;
    const mechOn = Boolean(mechanic) && filter.phase === phase && filter.mechanic === mechanic;
    const narrowed = !mechanic && filter.phase === phase && Boolean(filter.mechanic);
    chip.classList.toggle("on", mechanic ? mechOn : phaseOn);
    chip.classList.toggle("in", narrowed);
    chip.setAttribute("aria-pressed", mechanic ? String(mechOn) : String(phaseOn));
    if (mechanic) {
      chip.title = mechOn ? "Show every pull" : `Show pulls that ended at ${mechanic}`;
    } else {
      const name = chip.dataset.pullName || "";
      if (phaseOn) chip.title = "Show every pull";
      else if (narrowed) chip.title = `Show every pull that ended in ${name}`;
      else chip.title = `Show pulls that ended in ${name}`;
    }
  }
  const fold = key.closest("details.fold");
  if (!fold) return;
  const buttons = [...fold.querySelectorAll("button.nav.pull")];
  const matched = buttons.filter(button => !scopeHides(button)).length;
  const line = fold.querySelector("summary .countline");
  if (line) line.textContent = active ? `${matched}/${buttons.length}` : String(buttons.length);
  const note = fold.querySelector(".pull-empty");
  if (note) note.hidden = !(active && matched === 0);
}
function applyNavFilters() {
  const query = (document.getElementById("filter")?.value || "").trim().toLowerCase();
  for (const session of document.querySelectorAll("#nav details.session")) {
    const label = (session.dataset.label || "").toLowerCase();
    session.dataset.hit = query && label.includes(query) ? "1" : "";
  }
  for (const button of document.querySelectorAll("#nav button.nav")) {
    if (button.dataset.keep) {
      button.hidden = false;
      continue;
    }
    const session = button.closest("details.session");
    const sessionHit = session && session.dataset.hit === "1";
    const label = button.dataset.label || "";
    const textHidden = query !== "" && !sessionHit && !label.includes(query);
    button.hidden = textHidden || scopeHides(button);
  }
  for (const key of document.querySelectorAll("#nav .pull-key")) syncPullKey(key);
  const active = document.querySelector("#nav button.nav.on");
  for (const session of document.querySelectorAll("#nav details.session")) {
    const buttons = [...session.querySelectorAll("button.nav")].filter(button => !button.dataset.keep);
    const textMatch = buttons.some(button => (button.dataset.label || "").includes(query));
    const matched = !query || session.dataset.hit === "1" || textMatch;
    session.hidden = Boolean(query) && !matched;
    session.open = query ? matched : savedOpen(session, active);
  }
  for (const fold of document.querySelectorAll("#nav details.fold:not(.session)")) {
    const buttons = [...fold.querySelectorAll("button.nav")].filter(button => !button.dataset.keep);
    const foldId = fold.dataset.fold || "";
    const filtering = foldId.startsWith("pulls-") && Boolean(pullFilterOf(foldId.slice("pulls-".length)).phase);
    if (query) {
      fold.open = filtering || buttons.some(button => (button.dataset.label || "").includes(query));
      continue;
    }
    fold.open = filtering || savedOpen(fold, active);
  }
}
document.body.addEventListener("click", event => {
  const chip = event.target.closest("#nav button[data-pull-phase]");
  if (chip) {
    const key = chip.closest(".pull-key");
    const phase = chip.dataset.pullPhase;
    const mechanic = chip.dataset.pullMechanic || "";
    const code = key.dataset.session;
    const current = pullFilterOf(code);
    if (mechanic) {
      if (current.phase === phase && current.mechanic === mechanic) delete pullFilters[code];
      else pullFilters[code] = { phase, mechanic };
    } else if (current.phase === phase && !current.mechanic) {
      delete pullFilters[code];
    } else {
      pullFilters[code] = { phase, mechanic: "" };
    }
    applyNavFilters();
    return;
  }
  const summary = event.target.closest("#nav summary");
  if (summary) {
    const fold = summary.parentElement;
    foldState[fold.dataset.fold] = !fold.open;
  }
  const row = event.target.closest("[data-go]");
  if (!row) return;
  const next = row.dataset.go;
  if ((location.hash.replace(/^#/, "") || "") === next) render();
  location.hash = next;
});
function savedOpen(fold, active) {
  const saved = fold.dataset.fold in foldState ? foldState[fold.dataset.fold] : fold.dataset.default === "1";
  return saved || Boolean(active && fold.contains(active));
}
document.body.addEventListener("input", event => {
  if (event.target.id !== "filter") return;
  applyNavFilters();
});
const trendScrollLeft = {};
function placeTrendScroll() {
  for (const node of document.querySelectorAll(".trend-scroll")) {
    const key = node.dataset.trend || "";
    const saved = trendScrollLeft[key];
    node.scrollLeft = saved == null ? node.scrollWidth : saved;
  }
}
document.body.addEventListener("scroll", event => {
  const node = event.target;
  if (!node.classList || !node.classList.contains("trend-scroll")) return;
  trendScrollLeft[node.dataset.trend || ""] = node.scrollLeft;
}, true);
document.body.addEventListener("toggle", event => {
  const node = event.target;
  if (!node.classList || !node.classList.contains("session-preview")) return;
  previewOpen[node.dataset.code] = node.open;
}, true);
window.addEventListener("hashchange", render);
render();

function navMax() {
  return Math.max(NAV.min, window.innerWidth - NAV.gutter);
}
function clampNav(px) {
  return Math.round(Math.min(navMax(), Math.max(NAV.min, px)));
}
function shownNav() {
  const n = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--nav-width"));
  return Number.isFinite(n) ? n : NAV.def;
}
let navPreferred = NAV.def;
try {
  const saved = Number(localStorage.getItem(NAV.key));
  if (saved >= NAV.min) navPreferred = saved;
} catch (e) {}
function applyNavWidth(persist) {
  const shown = clampNav(navPreferred);
  document.documentElement.style.setProperty("--nav-width", shown + "px");
  const handle = document.getElementById("nav-split");
  if (handle) {
    handle.setAttribute("aria-valuenow", String(shown));
    handle.setAttribute("aria-valuemin", String(NAV.min));
    handle.setAttribute("aria-valuemax", String(navMax()));
  }
  if (!persist) return;
  try { localStorage.setItem(NAV.key, String(Math.round(navPreferred))); } catch (e) {}
}
applyNavWidth(false);
const navSplit = document.getElementById("nav-split");
if (navSplit) {
  let drag = null;
  navSplit.addEventListener("pointerdown", event => {
    if (event.button !== 0) return;
    event.preventDefault();
    navSplit.setPointerCapture(event.pointerId);
    drag = { id: event.pointerId, offset: shownNav() - event.clientX, moved: false };
    document.body.classList.add("nav-resizing");
  });
  navSplit.addEventListener("pointermove", event => {
    if (!drag || event.pointerId !== drag.id) return;
    const next = clampNav(event.clientX + drag.offset);
    if (next === clampNav(navPreferred)) return;
    drag.moved = true;
    navPreferred = next;
    applyNavWidth(false);
  });
  function endNavDrag(event) {
    if (!drag || event.pointerId !== drag.id) return;
    const moved = drag.moved;
    drag = null;
    document.body.classList.remove("nav-resizing");
    if (moved) applyNavWidth(true);
  }
  navSplit.addEventListener("pointerup", endNavDrag);
  navSplit.addEventListener("pointercancel", endNavDrag);
  navSplit.addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
  });
  navSplit.addEventListener("dblclick", event => {
    event.preventDefault();
    navPreferred = NAV.def;
    applyNavWidth(true);
  });
  navSplit.addEventListener("keydown", event => {
    const step = event.shiftKey ? 48 : 16;
    const shown = shownNav();
    let next = null;
    if (event.key === "ArrowLeft") next = shown - step;
    else if (event.key === "ArrowRight") next = shown + step;
    else if (event.key === "Home") next = NAV.min;
    else if (event.key === "End") next = navMax();
    else return;
    event.preventDefault();
    navPreferred = clampNav(next);
    applyNavWidth(true);
  });
}
window.addEventListener("resize", () => applyNavWidth(false));
</script>
</body>
